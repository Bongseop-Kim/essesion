name: ci

env:
  # Vite production build validation. CI never sends traffic to these values.
  VITE_API_BASE_URL: https://api.example.invalid
  VITE_TOSS_CLIENT_KEY: test_ci_client_key

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; packageManager 필드에서 pnpm 버전 결정
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build && pnpm typecheck && pnpm test

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:check

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose up -d --wait gcs
      # worker fabric/raster 테스트의 래스터라이저 — 없으면 해당 테스트가 skip돼 공백이 생긴다
      # azure 우분투 미러가 간헐적으로 행 — 러너 미러리스트에서 azure를 제거하고 fetch 타임아웃으로 방어
      - run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3 install -y --no-install-recommends librsvg2-bin
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      # 계약 퍼징은 contract 잡에서 병렬로 — 여기 남겨두면 이 잡이 CI 크리티컬 패스가 된다
      - run: uv run pytest --ignore=apps/api/tests/test_contract.py

  # schemathesis 계약 퍼징(오퍼레이션 191개) — 직렬로 ~6분이라 py에서 떼어내 xdist로 돌린다.
  # api만 필요하므로 librsvg 설치는 생략. CPU 경합에 민감한 api/worker 테스트는 py에 직렬로 남는다.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest apps/api/tests/test_contract.py -n 4

  # api 스펙만 바뀌고 api-client 생성물이 안 바뀐 채 머지되는 것을 차단 (AGENTS.md 대원칙)
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: git diff --exit-code -- packages/api-client

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: essesion
          POSTGRES_PASSWORD: essesion
          POSTGRES_DB: essesion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U essesion -d essesion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: local
      DATABASE_URL: postgresql+asyncpg://essesion:essesion@localhost:5432/essesion
      SEED_ADMIN_PASSWORD: admin-local-password
      E2E_ADMIN_EMAIL: admin@local
      E2E_ADMIN_PASSWORD: admin-local-password
      E2E_CUSTOMER_EMAIL: customer@local
      E2E_CUSTOMER_PASSWORD: customer-local-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose up -d --wait gcs
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - run: uv run alembic -c db/alembic.ini upgrade head
      - run: uv run python apps/api/scripts/seed.py
      # --with-deps 내부 apt가 미러 행에 걸리면 잡이 몇 시간 멈춘다 — azure 미러 제거 + 타임아웃 후 1회 재시도
      - run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          timeout 300 pnpm exec playwright install --with-deps chromium || pnpm exec playwright install --with-deps chromium
        timeout-minutes: 12
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: osv-scanner (pnpm-lock + uv.lock)
        env:
          OSV_SCANNER_VERSION: v2.3.8
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl --fail --show-error --silent --location -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
          ./osv-scanner scan source -r .
